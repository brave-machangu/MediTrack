# MediTrack web server (docs/architecture.md: nginx serves the SPA and proxies the API).
# Installed as /etc/nginx/conf.d/default.conf in nginx-unprivileged: non-root, port 8080.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's embedded DNS, asked at request time: nginx starts while the backend is down, and finds a
    # recreated backend container (new IP after a deploy or rollback) without a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # On every response, errors too. No location below uses add_header, so they all inherit these.
    # The SPA loads one script and one stylesheet from /assets and calls the API on the same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # With a variable and no URI part, proxy_pass forwards the request URI unchanged.
    location /api/ {
        proxy_pass $backend;
    }

    location = /healthz {
        proxy_pass $backend;
    }

    location = /readyz {
        proxy_pass $backend;
    }

    # Vite puts a content hash in these names, so a new build never reuses one.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app has no favicon; answer without falling back to index.html.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Client-side routes get the app. index.html is revalidated each time, so a deploy shows at once.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
