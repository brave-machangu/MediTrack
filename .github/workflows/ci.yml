# CI (MT-031, OPS-02). Runs on every pull request and on every push to main.
# Target state and the jobs later tasks add: docs/development-workflow.md §6.
#
# Supply chain (docs/security.md): actions and images are pinned by commit SHA or digest,
# each version at least two weeks old when pinned. The workflow token is read-only.
name: CI

on:
  pull_request:
    # labeled/unlabeled: the migrations job reads the PR's labels, so it re-runs
    # when the Lead adds or removes `contract-migration`.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.10"
  NODE_VERSION: "22.22.3"
  FORCE_COLOR: "1"

jobs:
  spec:
    name: Spec (docs, backlog, OpenAPI lint, hooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Docs links, anchors and ID references
        run: python scripts/check_docs.py
      - name: backlog/tasks.md matches backlog/backlog.json
        run: python scripts/render_backlog.py --check
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1.34.20 lint api/openapi.yaml
      - name: Migration check self-test
        run: python -m unittest discover -s scripts/tests -v
      - name: Pre-commit hooks
        # gitleaks has its own job (below); the two local hooks ran as steps above.
        env:
          SKIP: gitleaks,backlog-rendered,docs-check
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER"   # first push: scan the whole history
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Scanning $range"
          # Same uid as the checkout, so git inside the container trusts the repository.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git --no-banner --redact --log-opts="$range" /repo

  backend-lint:
    name: Backend lint and types (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      # --extend-exclude '*.md': ruff 0.17 also formats the code blocks in Markdown files, and
      # backend/DESIGN.md is prose. Python files are all still checked. Tracked in #55.
      - run: uv run ruff format --check --extend-exclude '*.md' .
      - run: uv run mypy app

  backend-tests:
    name: Backend tests (SQLite, TZ=${{ matrix.tz }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # AC-35: identical results whatever the process timezone.
        tz: [UTC, America/Los_Angeles]
    defaults:
      run:
        working-directory: backend
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -rs

  backend-postgres:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          # Throwaway database that lives only for this job; not a secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meditrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meditrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Variables from backend/DESIGN.md §6. The backend reads them from MT-013 on, when
      # psycopg and the PostgreSQL fixture arrive; until then these tests still use SQLite.
      MEDITRACK_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/meditrack_test
      # Turns "PostgreSQL not configured" skips into failures, so AC-18 can't be skipped here.
      MEDITRACK_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: PostgreSQL is reachable
        run: pg_isready -h localhost -p 5432 -U postgres -d meditrack_test
      - run: uv sync --locked
      - run: uv run pytest tests/integration -rs

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Vitest runs the tests under TZ=Asia/Tokyo (vite.config.ts, AC-35).
      - run: npm run test
      - run: npm run build

  frontend-types:
    name: Frontend API types match the contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - name: src/api/schema.d.ts is up to date
        run: git diff --exit-code -- src/api/schema.d.ts

  audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit (backend, all dependency groups)
        working-directory: backend
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  migrations:
    name: Migration safety (expand/contract)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Destructive migrations need the contract-migration label
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_migrations.py --base "origin/$BASE_REF" --labels "$PR_LABELS"

  compose-smoke:
    name: Compose smoke test (make up, record a dose, restart)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make up (build, migrate, start; waits for /readyz)
        run: make up
      - name: Smoke test
        id: smoke
        run: |
          ./scripts/smoke.sh http://localhost:8080 | tee "$RUNNER_TEMP/smoke.log"
          echo "patient_id=$(sed -n 's/^patient_id=//p' "$RUNNER_TEMP/smoke.log")" >> "$GITHUB_OUTPUT"
      - name: Data survives a backend restart (AC-30)
        env:
          SMOKE_EXPECT_PATIENT: ${{ steps.smoke.outputs.patient_id }}
        run: |
          docker compose restart backend
          ./scripts/smoke.sh http://localhost:8080
      - name: Container status and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Stop and remove the stack
        if: always()
        run: docker compose down --volumes
