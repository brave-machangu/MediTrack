# Weekly dependency updates. Dependabot PRs are reviewed and merged by the Lead
# like any other PR, and CI (MT-031) runs on them.
# uv (backend/) and npm (frontend/) are active. The docker entries become active
# when the Dockerfiles arrive (MT-021, MT-029).
# cooldown: version updates are proposed only for releases at least 14 days old, the
# supply-chain rule in docs/security.md §4. GitHub doesn't apply it to security updates,
# which still arrive immediately.
# Major upgrades of typescript and @types/node are ignored: the frontend pins
# TypeScript ~5.9 and targets Node 22 (package.json engines). Upgrade them on
# purpose in a frontend task.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies are managed with uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
