# Local guardrails. Install once per clone:
#   uvx pre-commit@4.6.2 install          (or: pipx run pre-commit install)
# Run everything by hand:
#   uvx pre-commit@4.6.2 run --all-files
# CI runs the same hooks (MT-031). Language linters (ruff, eslint) are added by the
# tasks that create the backend and frontend.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Secret scanning: blocks commits that contain keys, tokens or passwords.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: backlog-rendered
        name: backlog/tasks.md matches backlog/backlog.json
        entry: python scripts/render_backlog.py --check
        language: system
        files: ^(backlog/|scripts/render_backlog\.py$)
        pass_filenames: false
      - id: docs-check
        name: docs links, anchors and ID references
        entry: python scripts/check_docs.py
        language: system
        files: \.(md|json|ya?ml)$
        pass_filenames: false
